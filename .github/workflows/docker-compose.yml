name: Docker Compose CI

on:
  push:
    branches:
      - final2  # Trigger when changes are pushed to the 'final2' branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: final2  # Replace with your desired branch name

      # Step 2: Verify Docker and Docker Compose are available
      - name: Verify Docker and Docker Compose version
        run: |
          docker --version  # Verify Docker installation
          docker compose --version  # Verify Docker Compose installation

      # Step 3: Build the Docker images using Docker Compose
      - name: Build Docker Compose images
        run: |
          docker compose up -d --build  # Build the images as defined in your docker-compose.yml

      # Step 4: Tag the image correctly for Docker Hub
      - name: Tag Docker images for Docker Hub
        run: |
          IMAGE_NAME_APP="phaneendrasharma1/public_complaint_repo:public_complaint_system-app"  # Tag for the app service
          IMAGE_NAME_MONGO="phaneendrasharma1/public_complaint_repo:mongo"  # Tag for the mongo service

          docker tag public_complaint_system-app $IMAGE_NAME_APP  # Tag the app image with your Docker Hub repo
          docker tag mongo $IMAGE_NAME_MONGO  # Tag mongo image with your Docker Hub repo

      # Step 5: Log in to Docker Hub
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login --username ${{ secrets.DOCKER_USERNAME }} --password-stdin

      # Step 6: Push the Docker images to Docker Hub
      - name: Push Docker images
        run: |
          docker push phaneendrasharma1/public_complaint_repo:public_complaint_system-app  # Push the app image
          docker push phaneendrasharma1/public_complaint_repo:mongo  # Push the mongo image

      # Step 7: Optional - Tear down services after the job is finished
      - name: Tear down services
        if: always()
        run: |
          docker compose down  # Clean up by bringing down the services
