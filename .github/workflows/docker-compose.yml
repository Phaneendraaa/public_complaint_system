name: Docker Compose CI

on:
  push:
    branches:
      - final2  # Your target branch (can change to 'main' or any other)

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: final2  # Replace with desired branch name

      - name: Set up Docker Compose
        run: |
          docker-compose --version

      - name: Build and Run Docker Compose
        run: |
          docker compose up -d --build

      - name: Wait a few seconds for containers to initialize
        run: sleep 10

      - name: Show running containers
        run: docker ps

      - name: Tear down services
        if: always()
        run: docker-compose down
