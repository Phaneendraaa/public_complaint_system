name: Docker Compose CI

on:
  push:
    branches:
      - final2  # Trigger when changes are pushed to the 'final2' branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: final2  # Replace with your desired branch name

      # Step 2: Verify Docker and Docker Compose are available
      - name: Verify Docker and Docker Compose version
        run: |
          docker --version  # Verify Docker installation
          docker compose --version  # Verify Docker Compose installation

      # Step 3: Build the Docker images using Docker Compose
      - name: Build Docker Compose images
        run: |
          docker compose up -d --build  # Build the images as defined in your docker-compose.yml

      # Step 4: Tag the image correctly for Docker Hub with commit SHA
      - name: Tag Docker images for Docker Hub
        run: |
          IMAGE_NAME_APP="phaneendrasharma1/public_complaint_repo:public_complaint_system-app-${{ github.sha }}"  # Tag for the app service with commit SHA
          IMAGE_NAME_MONGO="phaneendrasharma1/public_complaint_repo:mongo-${{ github.sha }}"  # Tag for the mongo service with commit SHA

          docker tag public_complaint_system-app $IMAGE_NAME_APP  # Tag the app image with your Docker Hub repo and commit SHA
          docker tag mongo $IMAGE_NAME_MONGO  # Tag mongo image with your Docker Hub repo and commit SHA

      # Step 5: Log in to Docker Hub
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login --username ${{ secrets.DOCKER_USERNAME }} --password-stdin

      # Step 6: Push the Docker images to Docker Hub
      - name: Push Docker images
        run: |
          docker push phaneendrasharma1/public_complaint_repo:public_complaint_system-app-${{ github.sha }}  # Push the app image
          docker push phaneendrasharma1/public_complaint_repo:mongo-${{ github.sha }}  # Push the mongo image

      # Step 7: Update the Kubernetes deployment.yml file with the new image
      - name: Update deployment.yml with new image
        run: |
          sed -i "s|image: phaneendrasharma1/public_complaint_repo:public_complaint_system-app.*|image: phaneendrasharma1/public_complaint_repo:public_complaint_system-app-${{ github.sha }}|" k8s/deployment.yml
          sed -i "s|image: phaneendrasharma1/public_complaint_repo:mongo.*|image: phaneendrasharma1/public_complaint_repo:mongo-${{ github.sha }}|" k8s/deployment.yml

      # Step 8: Commit and push the updated deployment.yml file
      - name: Commit and push changes to deployment.yml
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add k8s/deployment.yml
          git commit -m "Update deployment image tags with GitHub SHA"
          git push origin final2  # Push the changes back to the repository

      # Step 9: Optional - Tear down services after the job is finished
      - name: Tear down services
        if: always()
        run: |
          docker compose down  # Clean up by bringing down the services
