apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public-complaint-system-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: public-complaint-system.example.com  # Your domain name
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: public-complaint-system
            port:
              number: 80
